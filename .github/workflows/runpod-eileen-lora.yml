name: RunPod Eileen LoRA image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - handler.py
      - Dockerfile
      - requirements.txt
      - .dockerignore
      - .github/workflows/runpod-eileen-lora.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: runpod-eileen-lora
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/adamsiwiec1/eileen-lora

jobs:
  build:
    name: Build and push linux/amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The official RunPod PyTorch devel image is ~10 GB compressed. GitHub
      # hosted runners start with little free disk, so drop unused toolchains
      # before the pull/build/push.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/local/share/powershell
          sudo rm -rf /usr/share/swift /usr/local/.ghcup
          sudo docker image prune -af
          df -h

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
