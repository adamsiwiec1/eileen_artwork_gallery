name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Builds both workspaces, so a broken API compile fails here rather than
      # during a Render deploy.
      - name: Build
        run: npm run build
